name: Auto EUserv

on:
  schedule:
    # 每周日 UTC 03:00 运行（北京时间 11:00）。
    # 原来是每月 13 号才跑一次，失败一次就要再等一个月，容易错过续期窗口。
    # 脚本自己会判断每台 VPS 是否到了可续期时间，不到就只报“无需更新”，
    # 所以每周跑不会重复续期，一次失败下周日还能再试。
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Set up Python
      uses: actions/setup-python@main
      with:
        python-version: '3.x'  # 指定Python3.x

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run script
      env:
        EUSERV_VERIFY_SSL: "false"
        EUSERV_USERNAME: ${{ secrets.EUSERV_USERNAME }}
        EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
        TRUECAPTCHA_USERID: ${{ secrets.TRUECAPTCHA_USERID }}
        TRUECAPTCHA_APIKEY: ${{ secrets.TRUECAPTCHA_APIKEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_USER_ID: ${{ secrets.TG_USER_ID }}
        GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GMAIL_PIN_RECIPIENTS: ${{ secrets.GMAIL_PIN_RECIPIENTS }}
      run: python Github_Action.py
    - name: Commit to keep repo active
      # 失败时也要提交：原来只有成功才提交空 commit 保活，
      # 连续失败就没有新推送，GitHub 会在仓库 60 天无活动后停掉定时任务。
      # 空提交不会触发本工作流（本工作流只响应定时和手动触发），不会死循环。
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit --allow-empty -m "Auto-commit to keep workflow active"
        git push
